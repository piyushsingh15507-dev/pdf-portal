<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Security Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin_style.css">
    <style>
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.25s ease-in-out;
        }
        .auth-form.hidden {
            display: none !important;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container" style="justify-content: center; align-items: center;">
        <!-- Standalone Admin Dual Auth Login Card -->
        <section class="card login-card" style="max-width: 460px; width: 100%; text-align: center; margin: 30px auto; padding: 32px 24px;">
            <div class="login-header">
                <div class="key-icon" style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
                <h2 style="font-size: 1.55rem; font-weight: 700; color: #fff; margin-bottom: 6px;">Admin Portal Login</h2>
                <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px;">Choose your preferred login method below.</p>
            </div>

            <!-- Dual Auth Method Switcher Tabs -->
            <div style="display: flex; gap: 8px; margin-bottom: 20px; background: rgba(5, 8, 20, 0.6); padding: 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <button id="auth-tab-pass" type="button" style="flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-family: inherit; font-size: 0.88rem; cursor: pointer; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: white; transition: all 0.2s ease;">
                    🔑 Master Password
                </button>
                <button id="auth-tab-otp" type="button" style="flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-family: inherit; font-size: 0.88rem; cursor: pointer; background: transparent; color: #9ca3af; transition: all 0.2s ease;">
                    📱 Telegram Bot OTP
                </button>
            </div>
            
            <!-- Option A: Master Password Login Form -->
            <form id="admin-pass-form" class="auth-form">
                <div class="form-group" style="text-align: left;">
                    <label for="login-admin-pass" style="font-size: 0.83rem; color: #9ca3af; font-weight: 500; margin-bottom: 6px; display: block;">Admin Master Password / Key</label>
                    <input type="password" id="login-admin-pass" placeholder="Enter Admin Password..." autocomplete="off" style="padding: 13px; font-size: 0.95rem;">
                </div>
                
                <button id="btn-submit-pass" type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); padding: 13px; font-size: 0.95rem; font-weight: 600;">
                    🔓 Login with Master Password
                </button>
            </form>

            <!-- Option B: Telegram Bot OTP Login Form -->
            <form id="admin-otp-form" class="auth-form hidden">
                <div class="form-group" style="text-align: center;">
                    <button id="btn-request-otp" type="button" class="btn btn-secondary" style="width: 100%; background: linear-gradient(135deg, #0088cc, #24a1de); color: white; padding: 13px; font-size: 0.95rem; font-weight: 600; border: none;">
                        📱 Send 6-Digit OTP to Telegram Bot
                    </button>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="login-admin-otp" style="font-size: 0.83rem; color: #9ca3af; font-weight: 500; margin-bottom: 6px; display: block;">6-Digit Telegram OTP</label>
                    <input type="text" id="login-admin-otp" placeholder="──────" maxlength="6" autocomplete="off" style="padding: 13px; font-size: 1.1rem; text-align: center; letter-spacing: 6px; font-family: 'JetBrains Mono', monospace;">
                </div>
                
                <button id="btn-submit-otp" type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981, #059669); padding: 13px; font-size: 0.95rem; font-weight: 600;">
                    🔓 Verify & Open Dashboard
                </button>
            </form>

            <div class="error-msg hidden" id="login-error-msg" style="margin-top: 14px;"></div>
            <div id="otp-info-banner" class="hidden" style="margin-top: 14px; padding: 10px; background: rgba(0, 136, 204, 0.15); border: 1px solid rgba(0, 136, 204, 0.3); border-radius: 8px; color: #38bdf8; font-size: 0.85rem;"></div>

            <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08);">
                <a href="/student.html" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none; font-weight: 500;">
                    🎓 Go to Student Portal →
                </a>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabPass = document.getElementById('auth-tab-pass');
            const tabOtp = document.getElementById('auth-tab-otp');
            const passForm = document.getElementById('admin-pass-form');
            const otpForm = document.getElementById('admin-otp-form');

            const passInput = document.getElementById('login-admin-pass');
            const btnSubmitPass = document.getElementById('btn-submit-pass');

            const btnRequestOtp = document.getElementById('btn-request-otp');
            const otpInput = document.getElementById('login-admin-otp');
            const btnSubmitOtp = document.getElementById('btn-submit-otp');

            const errorMsg = document.getElementById('login-error-msg');
            const otpInfoBanner = document.getElementById('otp-info-banner');

            // Tab Switching - Strict visibility toggle
            tabPass.addEventListener('click', () => {
                tabPass.style.background = 'linear-gradient(135deg, #8b5cf6, #3b82f6)';
                tabPass.style.color = 'white';
                tabOtp.style.background = 'transparent';
                tabOtp.style.color = '#9ca3af';
                passForm.classList.remove('hidden');
                otpForm.classList.add('hidden');
                hideError();
            });

            tabOtp.addEventListener('click', () => {
                tabOtp.style.background = 'linear-gradient(135deg, #0088cc, #24a1de)';
                tabOtp.style.color = 'white';
                tabPass.style.background = 'transparent';
                tabPass.style.color = '#9ca3af';
                otpForm.classList.remove('hidden');
                passForm.classList.add('hidden');
                hideError();
            });

            function showError(msg) {
                errorMsg.innerText = msg;
                errorMsg.classList.remove('hidden');
                otpInfoBanner.classList.add('hidden');
            }

            function hideError() {
                errorMsg.classList.add('hidden');
            }

            // Check existing session
            const existingSecret = sessionStorage.getItem('admin_secret') || localStorage.getItem('admin_secret');
            if (existingSecret) {
                fetch('/api/admin/get-data', {
                    headers: { 'X-Admin-Secret': existingSecret }
                }).then(res => {
                    if (res.ok) window.location.href = '/galactosidase_adadmiin.html';
                }).catch(() => {});
            }

            // Option A: Password Submit
            passForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = passInput.value.trim();
                if (!password) {
                    showError('Please enter Admin Master Password.');
                    return;
                }

                btnSubmitPass.disabled = true;
                btnSubmitPass.innerText = 'Verifying...';
                hideError();

                try {
                    const res = await fetch('/api/admin/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();

                    if (data.success && data.secret) {
                        sessionStorage.setItem('admin_secret', data.secret);
                        localStorage.setItem('admin_secret', data.secret);
                        window.location.href = '/galactosidase_adadmiin.html';
                    } else {
                        showError(data.error || 'Invalid Admin Master Password.');
                    }
                } catch (err) {
                    showError(`Network error: ${err.message}`);
                } finally {
                    btnSubmitPass.disabled = false;
                    btnSubmitPass.innerText = '🔓 Login with Master Password';
                }
            });

            let timerInterval = null;

            function startOtpCountdown(durationSec = 300) {
                if (timerInterval) clearInterval(timerInterval);
                let remaining = durationSec;
                
                btnRequestOtp.disabled = true;

                const updateTimerDisplay = () => {
                    const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
                    const secs = String(remaining % 60).padStart(2, '0');

                    if (remaining > 0) {
                        otpInfoBanner.innerHTML = `📱 OTP sent to Bot! <strong style="color: #facc15; font-family: monospace;">⏳ Expires in ${mins}:${secs}</strong>`;
                        btnRequestOtp.innerText = `⏳ Resend OTP in ${mins}:${secs}`;
                        otpInfoBanner.style.background = 'rgba(0, 136, 204, 0.15)';
                        otpInfoBanner.style.color = '#38bdf8';
                        otpInfoBanner.style.borderColor = 'rgba(0, 136, 204, 0.3)';
                    } else {
                        clearInterval(timerInterval);
                        otpInfoBanner.innerHTML = `❌ <strong>OTP Expired!</strong> Please click below to get a new code.`;
                        otpInfoBanner.style.background = 'rgba(239, 68, 68, 0.15)';
                        otpInfoBanner.style.color = '#f87171';
                        otpInfoBanner.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                        btnRequestOtp.disabled = false;
                        btnRequestOtp.innerText = '🔄 Resend New OTP to Telegram Bot';
                    }
                    remaining--;
                };

                updateTimerDisplay();
                timerInterval = setInterval(updateTimerDisplay, 1000);
            }

            // Option B: Request Telegram Bot OTP
            btnRequestOtp.addEventListener('click', async () => {
                btnRequestOtp.disabled = true;
                btnRequestOtp.innerText = 'Sending to Telegram Bot...';
                hideError();

                try {
                    const res = await fetch('/api/admin/request-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    const data = await res.json();

                    if (data.success) {
                        otpInfoBanner.classList.remove('hidden');
                        startOtpCountdown(300); // 5 Minutes
                    } else {
                        showError(data.error || 'Failed to send Telegram Bot OTP.');
                        btnRequestOtp.disabled = false;
                        btnRequestOtp.innerText = '📱 Send 6-Digit OTP to Telegram Bot';
                    }
                } catch (err) {
                    showError(`Error: ${err.message}`);
                    btnRequestOtp.disabled = false;
                    btnRequestOtp.innerText = '📱 Send 6-Digit OTP to Telegram Bot';
                }
            });

            // Option B: OTP Submit
            otpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const otp = otpInput.value.trim();
                if (!otp || otp.length < 6) {
                    showError('Please enter 6-digit Telegram OTP.');
                    return;
                }

                btnSubmitOtp.disabled = true;
                btnSubmitOtp.innerText = 'Verifying...';
                hideError();

                try {
                    const res = await fetch('/api/admin/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ otp })
                    });
                    const data = await res.json();

                    if (data.success && data.secret) {
                        sessionStorage.setItem('admin_secret', data.secret);
                        localStorage.setItem('admin_secret', data.secret);
                        window.location.href = '/galactosidase_adadmiin.html';
                    } else {
                        showError(data.error || 'Invalid or Expired Telegram OTP.');
                    }
                } catch (err) {
                    showError(`Network error: ${err.message}`);
                } finally {
                    btnSubmitOtp.disabled = false;
                    btnSubmitOtp.innerText = '🔓 Verify & Open Dashboard';
                }
            });
        });
    </script>
</body>
</html>
